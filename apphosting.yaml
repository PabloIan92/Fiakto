runConfig:
  minInstances: 0
  maxInstances: 1

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME

  # Config publica de Firebase Web SDK (NEXT_PUBLIC_*): no son secretos, se
  # embeben en el bundle del cliente igual que en cualquier app web de Firebase.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBuUYlxsZFQpW0VYdkE_XV3D9GnvAf6pdc"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "fiakto.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "fiakto"
    availability:
      - BUILD
      - RUNTIME
